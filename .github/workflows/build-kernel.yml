name: Build TB128FU kernel (BakaSU + SuSFS)

# 零费用：公开仓库标准 runner 免费；产物走 Release 附件（不计 Actions 存储）。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "bakasu = BakaSU+SuSFS, bakasu-nosusfs = BakaSU 手动 hook 无 SuSFS, vanilla = 纯净树"
        default: "bakasu-nosusfs"
        required: false
      mode:
        description: "full = 编译, patch = 只打补丁自检"
        default: "full"
        required: false
      bakasu_ref:
        description: "BakaSU tag/commit/branch"
        default: "v4.2.0-rc3"
        required: false
      source_tag:
        description: "存放官方源码包的 release tag（空 = git clone kernel_repo）"
        default: "src-4.19.157"
        required: false
      source_asset:
        description: "官方源码包 asset 名"
        default: "kernel_src_4.19.157.tar.gz"
        required: false
      kernel_repo:
        description: "kernel_repo（source_tag 为空时使用）"
        default: "https://github.com/Roynas-Android-Playground/kernel_lenovo_tb128fu.git"
        required: false
      kernel_branch:
        description: "kernel_branch"
        default: "master"
        required: false
      defconfig:
        description: "defconfig（arch/arm64/configs 下）"
        default: "P89990GA1_defconfig"
        required: false
      tc_mode:
        description: "aosp = AOSP clang 12 + LLD；lenovo = 源码包自带 clang-r383902b1 + gcc4.9 binutils"
        default: "lenovo"
        required: false
      config_asset:
        description: "用原厂 .config 构建（release 里的文件名，空 = 用 defconfig）"
        default: ""
        required: false
      force_modules:
        description: "忽略 vendor 模块的 vermagic/CRC 校验（true/false）"
        default: "false"
        required: false
      extra_defconfig:
        description: "额外追加到配置文件的 CONFIG 行（空格分隔）"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      AOSP_TC: ${{ github.workspace }}/tc
      KSU_REF: ${{ github.event.inputs.bakasu_ref || 'v4.2.0-rc3' }}
      MODE: ${{ github.event.inputs.mode || 'full' }}
      VARIANT: ${{ github.event.inputs.variant || 'bakasu-nosusfs' }}
      SOURCE_TAG: ${{ github.event.inputs.source_tag || '' }}
      SOURCE_ASSET: ${{ github.event.inputs.source_asset || 'kernel_src_4.19.157.tar.gz' }}
      KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/Roynas-Android-Playground/kernel_lenovo_tb128fu.git' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'master' }}
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'P89990GA1_defconfig' }}
      CONFIG_ASSET: ${{ github.event.inputs.config_asset || '' }}
      FORCE_MODULES: ${{ github.event.inputs.force_modules || 'false' }}
      EXTRA_DEFCONFIG: ${{ github.event.inputs.extra_defconfig || '' }}
      TC_MODE: ${{ github.event.inputs.tc_mode || 'lenovo' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git \
            gnupg gperf libelf-dev libssl-dev libxml2 libxml2-utils lzop \
            python3 rsync unzip zip zlib1g-dev device-tree-compiler cpio kmod

      - name: Fetch AOSP clang (aosp mode only)
        if: env.TC_MODE == 'aosp'
        run: |
          set -euxo pipefail
          rm -rf "$AOSP_TC"
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git "$AOSP_TC"
          "$AOSP_TC/bin/clang" --version

      - name: Fetch Android NDK r21 clang 10.0.7 (ndk10 mode only)
        if: env.TC_MODE == 'ndk10'
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          mkdir -p /tmp/ndk
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          /tmp/ndk/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version

      - name: Fetch AOSP clang r370808 = 10.0.7 (clang10 mode only)
        if: env.TC_MODE == 'clang10'
        run: |
          set -euxo pipefail
          rm -rf /tmp/clangrepo
          git clone --filter=blob:none --no-checkout --depth 1 -b android-11.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 /tmp/clangrepo
          cd /tmp/clangrepo
          git sparse-checkout init --cone
          git sparse-checkout set clang-r370808
          git checkout
          /tmp/clangrepo/clang-r370808/bin/clang --version

      - name: Prepare kernel source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/src
          if [ -n "${SOURCE_TAG:-}" ]; then
            echo "using official source asset ${SOURCE_TAG}/${SOURCE_ASSET}"
            gh release download "$SOURCE_TAG" -p "$SOURCE_ASSET" -O /tmp/ksrc.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
            tar -xzf /tmp/ksrc.tar.gz -C /tmp/src kernel-4.19.157
            mv /tmp/src/kernel-4.19.157 kernel
            mkdir -p kernel/arch/arm64/boot/dts/vendor
            # 恢复大小写冲突文件
            mkdir -p /tmp/casefix
            gh release download "$SOURCE_TAG" -p casefix.tar.gz -O /tmp/casefix.tgz --repo "$GITHUB_REPOSITORY" --clobber
            tar -xzf /tmp/casefix.tgz -C /tmp/casefix
            while IFS="$(printf '\t')" read -r src dst; do
              [ -n "$src" ] || continue
              if [ -s "/tmp/casefix/$src" ]; then
                mkdir -p "kernel/$(dirname "$dst")"
                cp "/tmp/casefix/$src" "kernel/$dst"
              fi
            done < /tmp/casefix/map.txt
            if [ "$TC_MODE" = "lenovo" ] || [ "$TC_MODE" = "ndk10" ] || [ "$TC_MODE" = "clang10" ]; then
              echo "downloading Lenovo toolchain asset"
              mkdir -p /tmp/tc
              gh release download "$SOURCE_TAG" -p lenovo_tc.tar.gz -O /tmp/tc.tgz --repo "$GITHUB_REPOSITORY" --clobber
              tar -xzf /tmp/tc.tgz -C /tmp/tc
              chmod -R +x /tmp/tc/prebuilts/clang/host/linux-x86/clang-r383902b1/bin || true
              chmod -R +x /tmp/tc/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin || true
              ls -la /tmp/tc/prebuilts/clang/host/linux-x86/clang-r383902b1/bin/clang-11
              ls -la /tmp/tc/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-ld
            fi
          else
            git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          fi
          cd kernel
          head -5 Makefile
          ls arch/arm64/configs/ | head -20

      - name: Integrate BakaSU
        if: startsWith(env.VARIANT, 'bakasu')
        run: |
          set -euxo pipefail
          cd kernel
          curl -fL --retry 3 -o /tmp/bakasu-setup.sh https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh
          bash /tmp/bakasu-setup.sh "$KSU_REF" 2>&1 | tee /tmp/bakasu-setup.log
          ls -la drivers/kernelsu | head -20
          git -C KernelSU describe --tags --always || true

      - name: Apply SuSFS kernel patch
        if: env.VARIANT == 'bakasu'
        run: |
          set -o pipefail
          cd kernel
          patch -p1 --no-backup-if-mismatch --forward < "$GITHUB_WORKSPACE/patches/susfs_v2.3.0_4.19_grass.patch" 2>&1 | tee /tmp/susfs-patch.log
          find . -name '*.rej' -print | tee /tmp/rej.txt
          test ! -s /tmp/rej.txt

      - name: Apply SuSFS inline hooks
        if: env.VARIANT == 'bakasu'
        run: |
          set -o pipefail
          cd kernel
          bash "$GITHUB_WORKSPACE/patches/susfs_inline_hook_patches.sh" 2>&1 | tee /tmp/susfs-hooks.log

      - name: Apply BakaSU manual hooks (no SuSFS)
        if: env.VARIANT == 'bakasu-nosusfs'
        run: |
          set -o pipefail
          cd kernel
          patch -p1 --no-backup-if-mismatch --forward < "$GITHUB_WORKSPACE/patches/ksu_manual_hooks_4.19_grass.patch" 2>&1 | tee /tmp/manual-hooks.log
          find . -name '*.rej' -print | tee /tmp/rej.txt
          test ! -s /tmp/rej.txt
          grep -c "ksu_handle" fs/stat.c fs/open.c fs/exec.c kernel/reboot.c

      - name: Relax module checks (vendor .ko compatibility)
        if: env.FORCE_MODULES == 'true'
        run: |
          set -euxo pipefail
          cd kernel
          patch -p1 --no-backup-if-mismatch --forward < "$GITHUB_WORKSPACE/patches/module_force_load.patch" 2>&1 | tee /tmp/module-patch.log
          grep -n "allow modules built with a different toolchain" kernel/module.c

      - name: Configure defconfig
        run: |
          set -euxo pipefail
          cd kernel
          if [ -n "${CONFIG_ASSET:-}" ]; then
            echo "using stock kernel config ${CONFIG_ASSET}"
            gh release download "$SOURCE_TAG" -p "$CONFIG_ASSET" -O arch/arm64/configs/stock_defconfig --repo "$GITHUB_REPOSITORY" --clobber
            DEFCONFIG=stock_defconfig
            echo "DEFCONFIG=stock_defconfig" >> "$GITHUB_ENV"
          fi
          DEF=arch/arm64/configs/$DEFCONFIG
          if [ "$VARIANT" = "bakasu" ]; then
            { echo ''; echo '# BakaSU + SuSFS';
              echo 'CONFIG_KSU=y'; echo 'CONFIG_KSU_SUSFS=y'; echo 'CONFIG_THREAD_INFO_IN_TASK=y';
              echo 'CONFIG_KSU_SUSFS_SUS_PATH=y'; echo 'CONFIG_KSU_SUSFS_SUS_MOUNT=y';
              echo 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'; echo 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y';
              echo 'CONFIG_KSU_SUSFS_ENABLE_LOG=y'; echo 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y';
              echo 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'; echo 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y';
              echo 'CONFIG_KSU_SUSFS_SUS_MAP=y'; } >> "$DEF"
          elif [ "$VARIANT" = "bakasu-nosusfs" ]; then
            { echo ''; echo '# BakaSU (manual hook, no SuSFS)';
              echo 'CONFIG_KSU=y'; echo 'CONFIG_KSU_MANUAL_HOOK=y';
              echo 'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y';
              echo 'CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y';
              echo 'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y';
              echo 'CONFIG_THREAD_INFO_IN_TASK=y';
              echo '# CONFIG_KSU_SUSFS is not set'; } >> "$DEF"
          fi
          if [ "$TC_MODE" = "aosp" ]; then
            echo '# CONFIG_MODVERSIONS is not set' >> "$DEF"
            echo '# CONFIG_LTO_CLANG is not set' >> "$DEF"
          fi
          # 与官方内核的 release 字符串保持一致，否则 vendor 里的 .ko 会因 vermagic 不符而加载失败
          echo 'CONFIG_LOCALVERSION="-perf+"' >> "$DEF"
          if [ -n "${EXTRA_DEFCONFIG:-}" ]; then
            for kv in $EXTRA_DEFCONFIG; do
              echo "$kv" >> "$DEF"
            done
          fi
          tail -12 "$DEF"

      - name: Build kernel
        if: env.MODE == 'full'
        run: |
          set -euxo pipefail
          cd kernel
          if [ "$TC_MODE" = "lenovo" ]; then
            LTC=/tmp/tc/prebuilts
            GCCDIR="$LTC/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
            CLANG="$LTC/clang/host/linux-x86/clang-r383902b1/bin/clang-11"
            export PATH="$GCCDIR:$PATH"
            CROSS_COMPILE=aarch64-linux-android-
            CLANG_TRIPLE=aarch64-linux-gnu-
          elif [ "$TC_MODE" = "ndk10" ]; then
            LTC=/tmp/tc/prebuilts
            GCCDIR="$LTC/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
            CLANG=/tmp/ndk/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
            export PATH="$GCCDIR:$PATH"
            CROSS_COMPILE=aarch64-linux-android-
            CLANG_TRIPLE=aarch64-linux-gnu-
          elif [ "$TC_MODE" = "clang10" ]; then
            LTC=/tmp/tc/prebuilts
            GCCDIR="$LTC/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
            CLANG=/tmp/clangrepo/clang-r370808/bin/clang
            export PATH="$GCCDIR:$PATH"
            CROSS_COMPILE=aarch64-linux-android-
            CLANG_TRIPLE=aarch64-linux-gnu-
          else
            export PATH="$AOSP_TC/bin:$PATH"
            CLANG="$AOSP_TC/bin/clang"
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
          fi
          "$CLANG" --version
          make O=out ARCH=arm64 CC="$CLANG" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" "$DEFCONFIG" 2>&1 | tee /tmp/defconfig.log
          grep -E '^CONFIG_(KSU|KSU_SUSFS|THREAD_INFO_IN_TASK|LTO|MODVERSIONS)' out/.config | tee /tmp/config-check.txt
          make O=out ARCH=arm64 CC="$CLANG" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="-Wno-unknown-attributes" \
            -j"$(nproc)" Image.gz 2>&1 | tee /tmp/build.log
          make O=out ARCH=arm64 CC="$CLANG" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)" modules 2>&1 | tee /tmp/modules.log
          rm -rf modout
          make O=out ARCH=arm64 CC="$CLANG" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" \
            INSTALL_MOD_PATH="$PWD/modout" modules_install 2>&1 | tee -a /tmp/modules.log

      - name: Collect outputs
        if: env.MODE == 'full'
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp kernel/out/arch/arm64/boot/Image.gz dist/Image.gz
          cp kernel/out/.config dist/config.txt
          KREL=$(cat kernel/out/include/config/kernel.release)
          tar -czf dist/modules.tar.gz -C "kernel/modout/lib/modules/$KREL" --exclude=build --exclude=source .
          cd dist && sha256sum Image.gz config.txt modules.tar.gz > SHA256SUMS.txt && ls -la

      - name: Package AnyKernel3 zip
        if: env.MODE == 'full'
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3work
          rm -rf ak3work/.git
          cp "$GITHUB_WORKSPACE/ak3/anykernel.sh" ak3work/anykernel.sh
          cp dist/Image.gz ak3work/Image.gz
          ZIP="TB128FU-${VARIANT}-${GITHUB_RUN_NUMBER}-AnyKernel3.zip"
          ( cd ak3work && zip -r9 "../dist/${ZIP}" . -x '*.git*' >/dev/null )
          cd dist && sha256sum "${ZIP}" >> SHA256SUMS.txt && ls -la

      - name: Publish release (no Actions storage)
        if: env.MODE == 'full'
        run: |
          set -euxo pipefail
          TAG="build-${VARIANT}-${GITHUB_RUN_NUMBER}"
          TITLE="TB128FU ${VARIANT} kernel #${GITHUB_RUN_NUMBER}"
          {
            echo "Kernel: $(cat kernel/out/include/config/kernel.release 2>/dev/null || echo unknown)"
            echo "Variant: ${VARIANT} | BakaSU: ${KSU_REF} | defconfig: ${DEFCONFIG} | toolchain: ${TC_MODE}"
            echo ""
            echo '```'
            cat /tmp/config-check.txt 2>/dev/null || true
            echo '```'
          } > /tmp/notes.md
          gh release create "$TAG" dist/*.zip dist/Image.gz dist/config.txt dist/modules.tar.gz dist/SHA256SUMS.txt \
            --title "$TITLE" --notes-file /tmp/notes.md --repo "$GITHUB_REPOSITORY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep only the latest 3 build releases
        if: env.MODE == 'full'
        continue-on-error: true
        run: |
          set -euxo pipefail
          gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName,createdAt \
            --jq '[.[] | select(.tagName|startswith("build-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' | while read -r tag; do
              [ -n "$tag" ] || continue
              gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
            done

      - name: Failure diagnostics
        if: failure()
        run: |
          {
            echo "### 构建失败"
            echo '```'
            tail -80 /tmp/build.log 2>/dev/null || tail -40 /tmp/defconfig.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
