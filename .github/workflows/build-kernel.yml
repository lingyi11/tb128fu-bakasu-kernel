name: Build TB128FU kernel (BakaSU + SuSFS)

# 零费用说明：
#   - 公开仓库的标准 runner 计算分钟免费
#   - 不使用 actions/upload-artifact（artifact 存储会按 GB·月 计费）
#   - 产物通过 GitHub Release 附件发布（Release 附件不计入 Actions 存储）
on:
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: "BakaSU tag/commit/branch"
        default: "v4.2.0-rc3"
        required: false
      kernel_commit:
        description: "kernel_lenovo_tb128fu commit"
        default: "e26c9a738"
        required: false
      mode:
        description: "full = 编译, patch = 只打补丁自检"
        default: "full"
        required: false
      variant:
        description: "bakasu = BakaSU+SuSFS, bakasu-nosusfs = BakaSU 手动 hook 无 SuSFS, vanilla = 纯净社区树"
        default: "bakasu"
        required: false
      kernel_repo:
        description: "kernel source repo url"
        default: "https://github.com/Roynas-Android-Playground/kernel_lenovo_tb128fu.git"
        required: false
      kernel_branch:
        description: "kernel source branch"
        default: "master"
        required: false
      defconfig:
        description: "defconfig name (under arch/arm64/configs)"
        default: "grass-perf_defconfig"
        required: false
      lto:
        description: "enable clang LTO (ld.lld), matches the reference build"
        default: "true"
        required: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      TC: ${{ github.workspace }}/tc
      KSU_REF: ${{ github.event.inputs.bakasu_ref || 'v4.2.0-rc3' }}
      KERNEL_COMMIT: ${{ github.event.inputs.kernel_commit || 'e26c9a738' }}
      MODE: ${{ github.event.inputs.mode || 'full' }}
      VARIANT: ${{ github.event.inputs.variant || 'bakasu' }}
      KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/Roynas-Android-Playground/kernel_lenovo_tb128fu.git' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'master' }}
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'grass-perf_defconfig' }}
      LTO: ${{ github.event.inputs.lto || 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git \
            gnupg gperf libelf-dev libssl-dev libxml2 libxml2-utils lzop \
            python3 rsync unzip zip zlib1g-dev device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld cpio kmod

      - name: Fetch AOSP clang r416183b
        run: |
          set -euxo pipefail
          rm -rf "$TC"
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git "$TC"
          "$TC/bin/clang" --version

      - name: Clone kernel source
        run: |
          set -euxo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git rev-parse HEAD
          if [ "$(git rev-parse HEAD)" != "$KERNEL_COMMIT" ]; then
            echo "::notice::HEAD $(git rev-parse HEAD) (pinned default $KERNEL_COMMIT)"
          fi
          git log --oneline -1
          head -5 Makefile
          ls arch/arm64/configs/ | head -20

      - name: Integrate BakaSU
        if: startsWith(env.VARIANT, 'bakasu')
        run: |
          set -euxo pipefail
          cd kernel
          curl -fL --retry 3 -o /tmp/bakasu-setup.sh https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh
          bash /tmp/bakasu-setup.sh "$KSU_REF" 2>&1 | tee /tmp/bakasu-setup.log
          ls -la drivers/kernelsu | head -20
          git -C KernelSU log --oneline -1 || true
          git -C KernelSU describe --tags --always || true

      - name: Apply SuSFS kernel patch
        if: env.VARIANT == 'bakasu'
        run: |
          set -o pipefail
          cd kernel
          patch -p1 --no-backup-if-mismatch --forward < "$GITHUB_WORKSPACE/patches/susfs_v2.3.0_4.19_grass.patch" 2>&1 | tee /tmp/susfs-patch.log
          find . -name '*.rej' -print | tee /tmp/rej.txt
          test ! -s /tmp/rej.txt
          grep -n "susfs_init\|susfs_is_inode_sus_path" fs/susfs.c | head -3

      - name: Apply SuSFS inline hooks
        if: env.VARIANT == 'bakasu'
        run: |
          set -o pipefail
          cd kernel
          bash "$GITHUB_WORKSPACE/patches/susfs_inline_hook_patches.sh" 2>&1 | tee /tmp/susfs-hooks.log
          grep -c "ksu_handle" fs/stat.c fs/open.c fs/exec.c kernel/reboot.c fs/namei.c security/selinux/hooks.c || true

      - name: Apply BakaSU manual hooks (no SuSFS)
        if: env.VARIANT == 'bakasu-nosusfs'
        run: |
          set -o pipefail
          cd kernel
          patch -p1 --no-backup-if-mismatch --forward < "$GITHUB_WORKSPACE/patches/ksu_manual_hooks_4.19_grass.patch" 2>&1 | tee /tmp/manual-hooks.log
          find . -name '*.rej' -print | tee /tmp/rej.txt
          test ! -s /tmp/rej.txt
          grep -c "ksu_handle" fs/stat.c fs/open.c fs/exec.c kernel/reboot.c

      - name: Configure defconfig
        run: |
          set -euxo pipefail
          cd kernel
          DEF=arch/arm64/configs/$DEFCONFIG
          if [ "$VARIANT" = "bakasu" ]; then
            {
              echo ''
              echo '# BakaSU + SuSFS'
              echo 'CONFIG_KSU=y'
              echo 'CONFIG_KSU_SUSFS=y'
              echo 'CONFIG_THREAD_INFO_IN_TASK=y'
              echo 'CONFIG_KSU_SUSFS_SUS_PATH=y'
              echo 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
              echo 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
              echo 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
              echo 'CONFIG_KSU_SUSFS_ENABLE_LOG=y'
              echo 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
              echo 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
              echo 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
              echo 'CONFIG_KSU_SUSFS_SUS_MAP=y'
            } >> "$DEF"
          elif [ "$VARIANT" = "bakasu-nosusfs" ]; then
            {
              echo ''
              echo '# BakaSU (manual hook, no SuSFS)'
              echo 'CONFIG_KSU=y'
              echo 'CONFIG_KSU_MANUAL_HOOK=y'
              echo 'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y'
              echo 'CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y'
              echo 'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y'
              echo 'CONFIG_THREAD_INFO_IN_TASK=y'
              echo '# CONFIG_KSU_SUSFS is not set'
            } >> "$DEF"
          fi
          # LTO: 与参考构建保持一致（需要 ld.lld + LLVM binutils）
          if [ "$LTO" != "true" ]; then
            echo '# CONFIG_LTO_CLANG is not set' >> "$DEF"
          fi
          tail -15 "$DEF"

      - name: Build kernel
        if: env.MODE == 'full'
        run: |
          set -euxo pipefail
          cd kernel
          if [ "$LTO" = "true" ]; then
            export PATH="$TC/bin:$PATH"
            MKARGS="LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          else
            MKARGS=""
          fi
          make O=out ARCH=arm64 \
            CC="$TC/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- $MKARGS \
            "$DEFCONFIG" 2>&1 | tee /tmp/defconfig.log
          grep -E '^CONFIG_(KSU|KSU_SUSFS|THREAD_INFO_IN_TASK|LTO|KPROBES)' out/.config | tee /tmp/config-check.txt
          make O=out ARCH=arm64 \
            CC="$TC/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- $MKARGS \
            KCFLAGS="-Wno-unknown-attributes" \
            -j"$(nproc)" Image.gz 2>&1 | tee /tmp/build.log

      - name: Collect outputs
        if: env.MODE == 'full'
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp kernel/out/arch/arm64/boot/Image.gz dist/Image.gz
          cp kernel/out/.config dist/config.txt
          cd dist && sha256sum Image.gz config.txt > SHA256SUMS.txt && ls -la

      - name: Package AnyKernel3 zip
        if: env.MODE == 'full'
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git
          cp "$GITHUB_WORKSPACE/ak3/anykernel.sh" ak3/anykernel.sh
          cp dist/Image.gz ak3/Image.gz
          ZIP="TB128FU-${VARIANT}-${GITHUB_RUN_NUMBER}-AnyKernel3.zip"
          ( cd ak3 && zip -r9 "../dist/${ZIP}" . -x '*.git*' >/dev/null )
          cd dist && sha256sum "${ZIP}" >> SHA256SUMS.txt && ls -la

      - name: Publish release (no Actions storage)
        if: env.MODE == 'full'
        run: |
          set -euxo pipefail
          TAG="build-${VARIANT}-${GITHUB_RUN_NUMBER}"
          TITLE="TB128FU ${VARIANT} kernel #${GITHUB_RUN_NUMBER}"
          {
            echo "Kernel: $(cat kernel/out/include/config/kernel.release 2>/dev/null || echo unknown)"
            echo "Variant: ${VARIANT}  |  BakaSU: ${KSU_REF}  |  Kernel commit: ${KERNEL_COMMIT}"
            echo ""
            echo "刷入方式：recovery 里刷 AnyKernel3 zip，或用 fastboot 刷手动重打包的 boot.img。"
            echo ""
            echo '```'
            cat /tmp/config-check.txt 2>/dev/null || true
            echo '```'
          } > /tmp/notes.md
          gh release create "$TAG" dist/*.zip dist/Image.gz dist/config.txt dist/SHA256SUMS.txt \
            --title "$TITLE" --notes-file /tmp/notes.md --repo "$GITHUB_REPOSITORY"
          echo "### 产物地址" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep only the latest 3 releases
        if: env.MODE == 'full'
        continue-on-error: true
        run: |
          set -euxo pipefail
          gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "deleting old release: $tag"
              gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
            done

      - name: Failure diagnostics
        if: failure()
        run: |
          {
            echo "### 构建失败"
            echo '```'
            tail -80 /tmp/build.log 2>/dev/null || tail -40 /tmp/susfs-patch.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
